name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
